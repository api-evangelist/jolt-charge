name: JOLT
kind: company
description: >-
  JOLT is a Sydney-headquartered electric vehicle charging network operator
  that builds and runs free-to-start kerbside DC fast chargers across Australia, and
  has since extended the same model into New Zealand, Canada, the United Kingdom and
  the United States. Its charge points deliver the first 7kWh of each day's charging
  at no cost — around 45km of range in roughly 15 minutes over CCS2 or CHAdeMO — funded
  not by the driver but by the digital out-of-home advertising screens mounted on the
  charger itself, which makes JOLT simultaneously a charge point operator and a media
  network selling audience reach to advertisers. It sits in the energy value chain
  as a downstream infrastructure and demand-side player: it buys electricity (claiming
  100% GreenPower green-certified wind and solar), owns and operates the charging
  assets on public and retail land in partnership with governments and hosts such as
  Transport for NSW, Ausgrid and major grocery retailers, and monetises the dwell time
  rather than the kilowatt-hour. Its API posture is honestly closed. JOLT publishes
  no developer programme, no API documentation, no OpenAPI or other machine-readable
  contract, and no open data feed; the only public HTTP surfaces on its domains are
  a marketing WordPress install (whose custom jolt/v1 REST namespace exposes a single
  VAT form endpoint) and an api.joltcharge.com host that serves a static redirect to
  the mobile app rather than any API. It is not a designated data holder under the
  Australian Consumer Data Right for energy — it does not appear in the CDR Register's
  energy data holder brands — so the CDR energy mandate that compels Australian
  electricity retailers to expose standardised usage and tariff data does not reach
  it, and no OCPP, OCPI, ISO 15118 or Green Button/ESPI conformance is published.
  All customer charging data, session history and audience analytics are reachable
  only through the JOLT consumer app or a sales conversation.
