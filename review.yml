      httpStatus: 200
      note: |
        The GitHub organisation github.com/jolt-charge (display name "Jolt Charge",
        linked from the site footer's LinkedIn slug pattern) holds 2 public repos,
        both forks of third-party React Native libraries: react-native-camera and
